agent:
  primary:
    provider: opencode
    model: default
  # secondary:              # fallback when primary unavailable
  #   provider: claude
  #   model: default
permissions:
  fs:
    # Gitignore-style: everything allowed by default.
    #   deny = blocked outright
    #   ask  = requires human approval before access
    #   (not listed) = allowed
    # Deny wins over ask. Empty lists = allow all.
    deny:
      - ".env"
      - "*.key"
      - "*.pem"
      - ".terraform/**"
      - "secrets/**"
    ask:
      - "migrations/**"
      - "Makefile"
  commands:
    # Same gitignore-style for CLI commands. Patterns match command prefixes.
    # "kubectl delete" matches "kubectl delete pods foo".
    # "*" within a pattern matches any single word (e.g. "gcloud * delete").
    deny:
      - "kubectl delete"
      - "kubectl apply"
      - "gcloud * delete"
      - "gcloud * create"
      - "aws * delete"
      - "az * delete"
      - "rm -rf /"
      - "rm -rf ~"
      - "git push --force"
      - "git push -f"
      - "git reset --hard"
      - "git clean -fd"
      - "git clean -xfd"
      - "sudo"
      - "chmod -R 777"
      - "dd if="
      - "mkfs"
      - "shutdown"
      - "reboot"
    ask:
      - "kubectl scale"
      - "gcloud * update"
      - "rm -rf"
      - "git push"
      - "npm publish"
      - "docker system prune"
a2a:
  # Both directions are enforced, and both default to false when omitted:
  #   allow_inbound  — may other agents wake this project?
  #   allow_outbound — may this project's agent delegate to others?
  allow_inbound: true
  allow_outbound: true
