# ============================================
# Release on v* tag push
# ============================================
# Builds binaries, generates AI release notes
# via OpenAI (secret OPENAI_API_KEY), creates
# the GitHub release with artifacts.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for os in darwin linux; do
            for arch in amd64 arm64; do
              for bin in hmf hmf-mcp; do
                dir="${bin}_${os}_${arch}"
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$dir/$bin" "./cmd/$bin"
                tar -czf "dist/$dir.tar.gz" -C "dist/$dir" "$bin"
              done
            done
          done
          (cd dist && shasum -a 256 ./*.tar.gz > checksums.txt)

      - name: Generate release notes (OpenAI)
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          # Commits since previous tag; fall back to last 30 if this is the first tag.
          PREV=$(git tag --sort=-creatordate | sed -n 2p)
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --format='- %s (%h)' "$PREV..${GITHUB_REF_NAME}")
          else
            LOG=$(git log --no-merges --format='- %s (%h)' -30)
          fi

          if [ -z "$OPENAI_API_KEY" ] || [ -z "$LOG" ]; then
            echo "Skipping AI notes (no key or no commits)" >&2
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(jq -n --arg log "$LOG" '{
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "You write concise GitHub release notes. Output GitHub-flavored markdown: a short summary line, a Changes section as a bullet list grouped by feat/fix/docs if possible. No preamble, no mention of being AI." },
              { role: "user",  content: ("Tag: " + $ENV.GITHUB_REF_NAME + "\nCommits:\n" + $log) }
            ],
            temperature: 0.3
          }')

          RESPONSE=$(curl -sf https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY") || { echo "OpenAI call failed, using fallback" >&2; exit 0; }

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > notes.md
          echo "path=notes.md" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          if [ -n "$NOTES_PATH" ] && [ -s "$NOTES_PATH" ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "$NOTES_PATH" dist/*
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes dist/*
          fi
