# ============================================
# Pre-commit hooks: go vet, go test, bun test, gitleaks
# ============================================
pre-commit:
  parallel: true
  commands:
    go-vet:
      glob: "*.go"
      run: go vet ./...
    go-test:
      glob: "*.go"
      run: go test ./...
    plugin-test:
      glob: "examples/plugins/hmf/*.ts"
      run: bun test examples/plugins/hmf/
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner
