agent:
  primary:
    provider: opencode
    model: default
  secondary:
    provider: ""
    model: ""
permissions:
  fs:
    deny:
      - ".env"
      - "*.key"
      - ".terraform/**"
      - "secrets/**"
    ask:
      - "migrations/**"
      - "Makefile"
a2a:
  allow_inbound: true
  allow_outbound: true
