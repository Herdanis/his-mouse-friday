agent:
  primary:
    provider: opencode
    model: default
  secondary:
    provider: ""
    model: ""
permissions:
  fs:
    deny:
      - ".env"
      - "*.key"
      - ".terraform/**"
      - "secrets/**"
    ask:
      - "migrations/**"
      - "Makefile"
  commands:
    deny:
      - "kubectl delete"
      - "kubectl apply"
      - "gcloud * delete"
      - "gcloud * create"
      - "aws * delete"
      - "az * delete"
    ask:
      - "kubectl scale"
      - "gcloud * update"
a2a:
  allow_inbound: true
  allow_outbound: true
