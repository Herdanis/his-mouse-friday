agent:
  primary:
    provider: opencode
    model: default
  # secondary:              # fallback when primary unavailable
  #   provider: claude
  #   model: default
permissions:
  fs: {}
  commands:
    deny:
      - "rm -rf /"
      - "rm -rf ~"
      - "git push --force"
      - "git push -f"
      - "git reset --hard"
      - "git clean -fd"
      - "git clean -xfd"
      - "sudo"
      - "chmod -R 777"
      - "dd if="
      - "mkfs"
      - "shutdown"
      - "reboot"
    ask:
      - "rm -rf"
      - "git push"
      - "npm publish"
      - "docker system prune"
a2a:
  allow_inbound: true
  allow_outbound: true
